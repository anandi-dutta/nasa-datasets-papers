<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA Datasets & Published Papers</title>
  <style>
    * { box-sizing: border-box; }
    body { 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      background-color: #f4f6f9; 
      margin: 0; 
      padding: 30px; 
      color: #333;
    }
    header { text-align: center; margin-bottom: 40px; }
    h1 { color: #0b3d91; margin-bottom: 10px; }
    p.subtitle { color: #666; margin-top: 0; margin-bottom: 30px; }
    
    .search-container { display: flex; justify-content: center; }
    #searchInput { 
      width: 100%; max-width: 600px; padding: 15px 20px; font-size: 16px; 
      border: 1px solid #ccc; border-radius: 25px; outline: none; 
      box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: box-shadow 0.2s ease; 
    }
    #searchInput:focus { box-shadow: 0 4px 10px rgba(11, 61, 145, 0.2); border-color: #0b3d91; }
    
    .grid { 
      display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
      gap: 25px; max-width: 1300px; margin: 0 auto; 
    }
    .card { 
      background: white; padding: 25px; border-radius: 12px; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s; 
      display: flex; flex-direction: column; 
    }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
    
    .tag { 
      align-self: flex-start; color: white; padding: 5px 12px; border-radius: 15px; 
      font-size: 0.8em; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; 
    }
    .tag.mars { background: #fc3d21; }
    .tag.moon { background: #888888; }
    
    .card h2 { font-size: 1.3em; margin-top: 0; margin-bottom: 15px; line-height: 1.3; }
    .card h2 a { color: #0b3d91; text-decoration: none; }
    .card h2 a:hover { text-decoration: underline; }
    
    h3 { font-size: 1em; color: #444; border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: auto; }
    ul { padding-left: 20px; margin-top: 10px; margin-bottom: 0; }
    li { margin-bottom: 10px; font-size: 0.95em; line-height: 1.4; }
    li a { color: #0066cc; text-decoration: none; word-break: break-word; }
    li a:hover { text-decoration: underline; }
    
    .no-results { text-align: center; grid-column: 1 / -1; font-size: 1.2em; color: #666; padding: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>NASA Datasets & Published Papers</h1>
    <p class="subtitle">Explore datasets and scientific research from Mars and the Moon.</p>
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search by planet, dataset name, or paper title...">
    </div>
  </header>

  <main>
    <div class="grid" id="dashboard">
      </div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
